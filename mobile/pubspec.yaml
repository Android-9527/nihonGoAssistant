name: nihon_go
description: "日语学习助手 - nihonGO"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 本地数据库：课本数据打包进 App，离线访问
  sqflite: ^2.4.0
  path: ^1.9.0
  # 网络：登录 / 测试 / 复习接口
  http: ^1.2.0
  # 状态管理
  provider: ^6.1.0
  # 登录 token 安全存储
  flutter_secure_storage: ^9.2.0
  # 本地 MP3 播放（打包的 TTS 音频）
  audioplayers: ^6.1.0
  # 系统语音合成兜底：无本地音频时用手机 TTS 朗读
  flutter_tts: ^4.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

